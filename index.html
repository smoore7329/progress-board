<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Progress Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script>
/* ---- settings: the only lines to change ---- */
window.PB_CONFIG = {
  api: "https://vbfspyruvaoqmhuutphl.supabase.co/functions/v1/progress-api",
  site: new URLSearchParams(location.search).get("site") || "palestine",
  pollSeconds: 30
};
</script>
<style>
:root{
  --bg:#eef1ef; --panel:#fbfcfb; --ink:#18242a; --muted:#5d6b70; --line:#cfd6d4; --empty:#e3e8e6; --hatch:#d6dcda;
  --accent:#1f5f86; --work:#3f7fa6; --ok:#2f8a57; --bad:#c2412d; --warn:#c98a12; --plan0:#7a4fd0; --plan1:#b07ad8; --plan2:#c9a6e6; --plan3:#e0c9f2; --late:#c2412d; --catch:#8a6d1f;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12181b; --panel:#192125; --ink:#e4ebe9; --muted:#93a2a6; --line:#2c383d; --empty:#243035; --hatch:#2b363b;
  --accent:#6fb1d8; --work:#5f9fc6; --ok:#55b880; --bad:#ec6a55; --warn:#e3b04a; --plan0:#a688ee; --plan1:#c3a0ea; --plan2:#8e78b0; --plan3:#6b5a85; --late:#ec6a55; --catch:#d9b860; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12181b; --panel:#192125; --ink:#e4ebe9; --muted:#93a2a6; --line:#2c383d; --empty:#243035; --hatch:#2b363b;
  --accent:#6fb1d8; --work:#5f9fc6; --ok:#55b880; --bad:#ec6a55; --warn:#e3b04a; --plan0:#a688ee; --plan1:#c3a0ea; --plan2:#8e78b0; --plan3:#6b5a85; --late:#ec6a55; --catch:#d9b860; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;margin:0}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1500px;margin:0 auto}
main .wrap>*,#areas>*,.area-body>*,.card,.zone{min-width:0}
header.top{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
header.top .wrap{padding-block:10px 8px;display:grid;gap:8px}
.titlebar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px}
h1{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:.01em;margin:0;line-height:1}
.status{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.status.err{color:var(--bad)}
.right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:-9px;overflow-x:auto}
.tab{border:0;background:none;color:var(--muted);font:600 14px var(--f-body);padding:8px 12px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.layers{display:flex;gap:6px;overflow-x:auto;padding:2px 0;scrollbar-width:thin}
.chip{flex:none;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:6px 12px 6px 10px;font:500 13px var(--f-body);cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;min-height:34px}
.chip .dot{width:10px;height:10px;border-radius:3px;background:var(--c,var(--work))}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.modehint{font-size:12.5px;color:var(--muted)}
.modehint b{color:var(--ink);font-weight:600}
main .wrap{padding-block:16px 90px;display:grid;gap:20px}
.summary{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px;display:grid;gap:4px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.stat .lab{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.stat .lab i{width:9px;height:9px;border-radius:2px;background:var(--c)}
.stat .num{font-family:var(--f-display);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.stat .num small{font:400 12px var(--f-mono);color:var(--muted);margin-left:4px}
.bar{height:4px;background:var(--empty);border-radius:2px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--c,var(--work))}
details.area>summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;gap:12px;padding:4px 0 10px;border-bottom:2px solid var(--ink)}
details.area>summary::-webkit-details-marker{display:none}
h2{font-family:var(--f-display);font-size:22px;font-weight:700;margin:0;text-transform:uppercase;letter-spacing:.04em}
.area-pct{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.area-body{display:grid;gap:12px;padding-top:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px 12px}
.card h3{margin:0 0 8px;font-size:13px;font-weight:600;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.card h3 code{font-family:var(--f-mono);font-size:11.5px;font-weight:400;color:var(--muted)}
.card h3 .pct{margin-left:auto;font-family:var(--f-mono);font-weight:400;font-size:12px;color:var(--muted)}
.scroll{overflow-x:auto}
.board{min-width:640px;display:grid;gap:4px}
.arow{display:grid;grid-template-columns:140px 1fr 60px;gap:8px;align-items:center}
.arow .nm{font-size:12px;font-family:var(--f-mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:none;border:0;color:inherit;text-align:left;padding:0}
.arow button.nm{cursor:pointer;text-decoration:underline dotted var(--muted);text-underline-offset:3px}
.track{position:relative;height:28px}
.axis .track{height:16px;border-bottom:1px solid var(--line)}
.tick{position:absolute;bottom:0;font:10px var(--f-mono);color:var(--muted);transform:translateX(-50%);white-space:nowrap}
.tick::after{content:"";position:absolute;left:50%;bottom:-1px;height:4px;border-left:1px solid var(--line)}
.extra{display:flex;gap:4px}
.sq{position:absolute;top:0;bottom:0;border:1px solid var(--line);border-radius:3px;background:var(--empty);padding:0;cursor:pointer;overflow:hidden;color:var(--ink)}
.sq.inline{position:relative;display:block;height:28px;width:28px;flex:none}
.sq .fill{position:absolute;left:0;right:0;bottom:0;height:0;background:var(--c,var(--work));transition:height .2s}
.sq .tag{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:500 10px var(--f-mono);color:var(--muted);pointer-events:none}
.sq.full .tag{color:#fff}
.sq.qcpass{border-color:var(--ok)}
.sq.qcpass::after,.sq.qcfail::after{content:"";position:absolute;right:2px;top:2px;width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 1.5px var(--panel)}
.sq.qcfail{border-color:var(--bad);border-width:2px}
.sq.qcfail::after{background:var(--bad)}
.sq.mm::before{content:"";position:absolute;left:0;top:0;border-style:solid;border-width:9px 9px 0 0;border-color:var(--warn) transparent transparent transparent;z-index:1}
.sq.tagged .tag::after{content:"T";position:absolute;left:2px;bottom:1px;font:600 9px var(--f-mono);color:var(--bad)}
.sq.plan0{box-shadow:inset 0 0 0 2px var(--plan0)}
.sq.plan1{box-shadow:inset 0 0 0 2px var(--plan1)}
.sq.plan2{box-shadow:inset 0 0 0 2px var(--plan2)}
.sq.plan3{box-shadow:inset 0 0 0 2px var(--plan3)}
.sq.planlate{box-shadow:inset 0 0 0 2px var(--late)}
.sq.planother{box-shadow:inset 0 0 0 2px var(--line)}
.catchbar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;background:color-mix(in srgb,var(--catch) 16%,var(--panel));border:1px solid var(--catch);border-radius:8px;padding:8px 12px;font-size:13px}
.catchbar b{color:var(--catch)}
.wk{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.wk .stat{border-left:5px solid var(--c)}
table.t select{min-height:32px;padding:3px 6px;max-width:260px}
.sq.na{background:repeating-linear-gradient(135deg,var(--empty) 0 3px,var(--hatch) 3px 6px);opacity:.55;cursor:default}
.sq.sel{outline:2px solid var(--ink);outline-offset:1px;z-index:2}
.sq.pending{opacity:.6}
.sq.flash{animation:flash .5s}
@keyframes flash{50%{transform:scale(1.15)}}
.mx{display:grid;gap:4px;min-width:520px}
.mx .h{font:600 12px var(--f-body);color:var(--muted);text-align:center;align-self:end}
.mx .rl{font:12px var(--f-mono);white-space:nowrap;align-self:center}
.mx .cell{height:30px}
.mx .cell .sq{position:relative;width:100%;height:100%;display:block}
.mx .blank{height:30px;border:1px dashed var(--line);border-radius:3px;opacity:.6}
.mx .sep{grid-column:1/-1;border-top:1px solid var(--line);margin:3px 0}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.tile-list{display:grid;gap:5px}
.trow{display:grid;grid-template-columns:1fr 32px;gap:8px;align-items:center;font-size:12.5px}
.trow .sq{position:relative;height:26px;width:32px;display:block}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12px;color:var(--muted);align-items:center}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{display:inline-block;width:16px;height:14px;border-radius:3px;border:1px solid var(--line);background:var(--empty);position:relative;overflow:hidden}
.note{font-size:12.5px;color:var(--muted);max-width:80ch;margin:0}
/* panels / dialogs */
.sheet{position:fixed;z-index:40;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(400px,calc(100vw - 24px));background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 36px rgba(0,0,0,.22);padding:14px 14px 12px;display:grid;gap:10px;max-height:min(84vh,640px);overflow:auto}
.sheet h4{margin:0;font-size:15px;line-height:1.3;padding-right:30px}
.sheet .meta{font:11.5px var(--f-mono);color:var(--muted)}
.close{position:absolute;right:8px;top:8px;border:0;background:none;color:var(--muted);font-size:22px;line-height:1;cursor:pointer;padding:4px 8px}
.stg{display:grid;grid-template-columns:24px 1fr auto;gap:4px 8px;align-items:center;padding:7px 8px;border:1px solid var(--line);border-radius:6px;cursor:pointer;background:var(--bg)}
.stg input{width:20px;height:20px;accent-color:var(--c);margin:0}
.stg .w{font:11px var(--f-mono);color:var(--muted)}
.stg .who{grid-column:2/4;font-size:11.5px;color:var(--muted)}
.stg.done{border-color:var(--c)}
.box{border:1px solid var(--line);border-radius:6px;padding:8px 10px;display:grid;gap:6px;font-size:13px}
.box.bad{border-color:var(--bad)} .box.ok{border-color:var(--ok)}
.btn{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:7px 12px;font:500 13px var(--f-body);cursor:pointer;min-height:36px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.btn.sm{min-height:30px;padding:3px 9px;font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=text],input[type=password],input[type=date],input[type=number],input[type=time],select,textarea{font:14px var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-height:36px}
textarea{width:100%;min-height:54px}
label.f{display:grid;gap:4px;font-size:12px;color:var(--muted)}
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:45}
.modal{position:fixed;z-index:46;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 40px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:12px;box-shadow:0 16px 48px rgba(0,0,0,.3)}
.modal.wide{width:min(860px,calc(100vw - 24px))}
.modal h4{margin:0;font-size:17px;padding-right:30px}
.toast{position:fixed;z-index:60;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--panel);padding:8px 10px 8px 14px;border-radius:8px;font-size:13px;display:flex;gap:12px;align-items:center;max-width:calc(100vw - 32px)}
.toast button{background:none;border:1px solid currentColor;color:inherit;border-radius:5px;padding:4px 10px;font:inherit;cursor:pointer}
table.t{border-collapse:collapse;font-size:13px;width:100%}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:right;white-space:nowrap}
table.t th:first-child,table.t td:first-child{text-align:left;white-space:normal}
table.t thead th{font-weight:600;color:var(--muted);font-size:12px}
table.t tfoot td{font-weight:600}
table.t input[type=number]{width:72px;min-height:30px;padding:3px 6px;text-align:right}
.num{font-variant-numeric:tabular-nums}
table.t.wt th{white-space:normal;max-width:120px;text-align:center;vertical-align:bottom}
table.t.wt td{text-align:center}
table.t.wt td:first-child{white-space:nowrap;text-align:left}
.crew-body{display:grid;gap:12px}
/* docked "My crew" panel (wide screens, like the Surface mockup) */
#dock{position:fixed;right:0;top:var(--hdr,96px);bottom:0;width:390px;background:var(--panel);border-left:1px solid var(--line);overflow:auto;z-index:18;padding:12px 14px calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:10px;align-content:start}
#dock h2{font-size:20px}
#dock .crewgrid{grid-template-columns:1fr}
#dock .kpi .v{font-size:22px}
#dock .card{padding:8px 10px}
body.docked #view-board, body.docked #boardbar{margin-right:390px}
body.docked .sheet{right:402px}
body.docked:not(.alltotals) #summary .stat:not(.keep){display:none}
#summary .more{display:none;align-items:center;justify-content:center;border:1px dashed var(--line);border-radius:6px;background:none;color:var(--muted);font:500 13px var(--f-body);cursor:pointer;min-height:44px}
body.docked #summary .more{display:flex}
.hc{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:22px;padding:0 7px;border-radius:999px;background:var(--accent);color:var(--panel);font:600 12px var(--f-body);flex:none}
.hc.g{background:color-mix(in srgb,var(--accent) 55%,var(--panel))}
@media (max-width:1099px){#dock{display:none!important} body.docked #view-board, body.docked #boardbar{margin-right:0} #dockbtn{display:none!important}}
/* crew screen */
.crewgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:820px){.crewgrid{grid-template-columns:1fr}}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.kpi .v{font:600 26px var(--f-display);font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi.bad .v{color:var(--bad)} .kpi.ok .v{color:var(--ok)}
.place{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.place .nm{font-weight:500}
.place .sub{font-size:12px;color:var(--muted)}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:600 20px var(--f-body);cursor:pointer}
.stepper output{min-width:34px;text-align:center;font:600 20px var(--f-display)}
.stepper output.chg{color:var(--accent)}
.people{display:flex;flex-wrap:wrap;gap:6px}
.person{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:3px 9px}
.person.on{border-color:var(--ok);color:var(--ok)}
.timeline{font:12px var(--f-mono);color:var(--muted);display:grid;gap:2px;max-height:220px;overflow:auto}
.pill{display:inline-block;font:600 11px var(--f-body);padding:2px 8px;border-radius:999px;border:1px solid currentColor}
.pill.closed{color:var(--ok)} .pill.open{color:var(--warn)}
.checklist{display:grid;gap:4px;max-height:50vh;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:6px}
.checklist label{display:flex;gap:8px;align-items:center;font-size:13px;padding:3px 4px}
.checklist .grp{font:600 11px var(--f-body);color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:6px 4px 2px}
.skeleton{padding:40px 0;color:var(--muted);text-align:center}
/* site map (laid out like the CWP print) */
:root{--tm:72%}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--tm:34%}}
:root[data-theme="dark"]{--tm:34%}
.viewrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.viewtog{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:none}
.viewtog button{border:0;background:var(--bg);color:var(--muted);font:600 13px var(--f-body);padding:6px 14px;min-height:34px;cursor:pointer}
.viewtog button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.mapcard{padding:10px 10px 12px}
.maphead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.maphead h3{margin:0}
.maphead .zoom{margin-left:auto;display:flex;gap:4px;align-items:center}
.maphead .zoom .btn{min-width:40px}
.mapscroll{overflow:auto;max-width:100%;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.map{position:relative;margin:4px auto 6px}
.mapscroll{padding-left:46px}
body.mapview #view-board #areas{order:-2}
body.mapview #view-board #legend{order:-1}
.sq.m{position:absolute;bottom:auto;border-radius:2px;background:color-mix(in srgb,var(--tint,var(--empty)) var(--tm),var(--empty));border-color:color-mix(in srgb,var(--ink) 22%,transparent)}
.sq.m.na{background:repeating-linear-gradient(135deg,var(--empty) 0 3px,var(--hatch) 3px 6px)}
.sq.m .tag{font:600 9px/1.1 var(--f-body);white-space:pre-line;text-align:center;color:var(--ink)}
.sq.m .tag.vt{writing-mode:vertical-rl;transform:rotate(180deg)}
.mlab{position:absolute;pointer-events:none;transform:translate(-50%,-50%);background:color-mix(in srgb,var(--panel) 88%,transparent);border-radius:4px;padding:2px 6px;font:700 11px var(--f-body);white-space:nowrap;display:flex;gap:5px;align-items:center;z-index:3;color:var(--ink);letter-spacing:.02em}
.mlab .p{font:500 11px var(--f-mono);color:var(--muted)}
.mlab.v{writing-mode:vertical-rl;transform:translate(-50%,-50%) rotate(180deg)}
.mfp{position:absolute;pointer-events:none;border:1px solid var(--line);border-radius:3px;background:repeating-linear-gradient(45deg,var(--panel) 0 4px,var(--empty) 4px 8px)}
.mfp.dash{background:none;border:1.5px dashed var(--line);border-radius:6px}
.mfp>span{position:absolute;left:4px;top:1px;font:600 10px var(--f-body);color:var(--muted);white-space:nowrap}
.mtag{position:absolute;font:600 10px var(--f-body);letter-spacing:.08em;color:var(--muted);white-space:nowrap}
.mtag.dir{color:var(--accent);background:color-mix(in srgb,var(--panel) 85%,transparent);padding:1px 4px;border-radius:3px;z-index:3}
.mruler{position:absolute;font:10px var(--f-mono);color:var(--muted);transform:translateY(-50%);white-space:nowrap}
.pctseg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.pctseg button{min-height:52px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:600 16px var(--f-mono);cursor:pointer}
.pctseg button.on{background:var(--work);border-color:var(--work);color:#fff}
.pctseg button.cur{outline:2px solid var(--ink);outline-offset:2px}
.pctseg button:disabled{cursor:default;opacity:.7}

  <div class="viewrow" id="viewrow" hidden>

<script>
"use strict";
const CFG = window.PB_CONFIG;
const $ = id => document.getElementById(id);
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const store = {
  get(k){ try { return JSON.parse(localStorage.getItem("pb:" + CFG.site + ":" + k)); } catch(e){ return null; } },
  set(k, v){ try { localStorage.setItem("pb:" + CFG.site + ":" + k, JSON.stringify(v)); } catch(e){} },
  del(k){ try { localStorage.removeItem("pb:" + CFG.site + ":" + k); } catch(e){} }
};
let auth = store.get("auth");   // {pass, name, role}

async function api(action, body = {}, quiet){
  const payload = { site: CFG.site, action, ...body };
  if (auth){ payload.pass = auth.pass; payload.by = auth.name; }
  let r;
  try {
    r = await fetch(CFG.api, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
  } catch(e){ throw Object.assign(new Error("No connection. Check signal and try again."), { status: 0 }); }
  let j = {}; try { j = await r.json(); } catch(e){}
  if (!r.ok){
    if (r.status === 401 && auth && action !== "login"){ auth = null; store.del("auth"); renderWho(); }
    throw Object.assign(new Error(j.error || ("Error " + r.status)), { status: r.status });
  }
  return j;
}

/* ---------- state ---------- */
let S = null;                    // full state from server
const ITEM = new Map();          // row_id -> item (+ where, n)
const ITEMS_BY_KEY = new Map();  // "r12" -> item
let TASK = {}, TASK_ORDER = [], W = {}, TYPE_TOTAL = {};
let PROG = {};                   // row_id -> Set(task)
let FLAGS = {};                  // row_id -> {note}
let PLAN = {};                   // row_id -> {week_start, crew, tasks}
let QC = {};
let tab = "progress", layer = "all", planWeek = 0, selected = null;
let catchUp = false, catchDate = store.get("catchdate") || "";
const PLAN_WEEKS = 4;
const pending = new Map();       // row_id -> count of in-flight writes

const isCrew = () => !!(auth && auth.role);
const isAdmin = () => !!(auth && auth.role === "admin");

function tasksFor(it){ const w = W[it.area_type] || {}; return TASK_ORDER.filter(t => w[t] > 0); }
function done(rid, t){ const s = PROG[rid]; return !!(s && s.has(t)); }
function pctOf(it){ const w = W[it.area_type] || {}; const tot = TYPE_TOTAL[it.area_type] || 0; if (!tot) return 0; let g = 0; for (const t of PROG[it.row_id] || []) g += w[t] || 0; return Math.min(1, g / tot); }
function qcOf(rid){ return QC[String(rid)] || null; }
function color(t){ return `var(--s-${t})`; }

function mondayOf(d){ const x = new Date(d); x.setHours(12,0,0,0); const dow = (x.getDay() + 6) % 7; x.setDate(x.getDate() - dow); return x; }
function ymd(d){ return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
function weekStart(offset){ const m = mondayOf(new Date()); m.setDate(m.getDate() + 7 * offset); return ymd(m); }
function weekLabel(offset){ const m = mondayOf(new Date()); m.setDate(m.getDate() + 7 * offset); const s = m.toLocaleDateString([], {month:"short", day:"numeric"}); return offset === 0 ? "This week (" + s + ")" : offset === 1 ? "Next week (" + s + ")" : "Week of " + s; }
function planClass(rid){
  const p = PLAN[rid]; if (!p) return "";
  for (let i = 0; i < PLAN_WEEKS; i++) if (p.week_start === weekStart(i)) return "plan" + i;
  if (p.week_start < weekStart(0)) return pctOf(ITEM.get(Number(rid))) >= .9999 ? "" : "planlate";
  return "planother";
}

/* ---------- applying server data ---------- */
function applyLive(d){
  PROG = {}; for (const [rid, s] of Object.entries(d.progress || {})) PROG[rid] = new Set(s ? s.split(" ") : []);
  FLAGS = {}; for (const f of d.flags || []) FLAGS[f.row_id] = f;
  PLAN = {}; for (const p of d.plan || []) PLAN[p.row_id] = p;
  QC = d.qc || {};
  if (d.qc_error) setStatus("Smartsheet QC data unavailable: " + d.qc_error, true);
}
function applyStatic(d){
  TASK = {}; TASK_ORDER = [];
  for (const t of d.tasks){ TASK[t.key] = t; TASK_ORDER.push(t.key); }
  W = {}; TYPE_TOTAL = {};
  for (const w of d.weights){ (W[w.area_type] ||= {})[w.task_key] = Number(w.weight); }
  for (const k in W) TYPE_TOTAL[k] = Object.values(W[k]).reduce((a, b) => a + b, 0);
  ITEM.clear(); for (const it of d.items) ITEM.set(it.row_id, { ...it });
  const L = TASK_ORDER.map(s => `--s-${s}:hsl(${TASK[s].hue} 46% 42%)`).join(";");
  const D = TASK_ORDER.map(s => `--s-${s}:hsl(${TASK[s].hue} 52% 63%)`).join(";");
  let st = $("task-colors"); if (!st){ st = document.createElement("style"); st.id = "task-colors"; document.head.append(st); }
  st.textContent = `:root{${L}}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){${D}}}:root[data-theme="dark"]{${D}}`;
}

/* ---------- board building ---------- */
const SQ = new Map(); const CARDS = [], AREAS = []; const ROWS = [];
function reg(raw, where){
  const rid = Number(String(raw.k).slice(1)); const it = ITEM.get(rid);
  if (!it) return null;
  it.where = where; it.n = raw.n; it.key = raw.k; ITEMS_BY_KEY.set(raw.k, it);
  return it;
}
function square(it, extraCls, tagText){
  const b = el("button", "sq" + (extraCls ? " " + extraCls : ""));
  b.type = "button"; b.dataset.r = it.row_id;
  b.setAttribute("aria-label", it.where + " – " + it.n);
  b.append(el("span", "fill"));
  b.append(el("span", "tag", tagText || ""));
  b.addEventListener("click", () => onSquare(it));
  SQ.set(it.row_id, b);
  return b;
}
function aisleCard(ph, maxBay, where){
  const card = el("div", "card");
  const h = el("h3"); h.append(document.createTextNode(ph.name), el("code", null, ph.grid || ph.code)); const pct = el("span", "pct"); h.append(pct); card.append(h);
  const sc = el("div", "scroll"); const bd = el("div", "board"); sc.append(bd); card.append(sc);
  const maxB = ph.max || maxBay;
  const ax = el("div", "arow axis"); ax.append(el("span", "nm", ph.ticks ? "Grid" : "Bay"));
  const at = el("div", "track");
  if (ph.ticks) for (const tk of ph.ticks){ const t = el("span", "tick", tk.label); t.style.left = (tk.at / maxB * 100) + "%"; if (tk.at === 0) t.style.transform = "none"; else if (tk.at === maxB) t.style.transform = "translateX(-100%)"; at.append(t); }
  else for (let b = 1; b <= maxB; b++) if (b === 1 || b % 5 === 0 || b === maxB){ const t = el("span", "tick", b); t.style.left = ((b - .5) / maxB * 100) + "%"; at.append(t); }
  ax.append(at, el("span")); bd.append(ax);
  const ids = [];
  for (const r of ph.rows){
    const row = el("div", "arow");
    const rowIds = [];
    const nm = el("button", "nm", r.name.replace(/ \(Bay [^)]*\)/, "")); nm.type = "button"; nm.title = r.name + " — tap to mark the whole row in a task layer";
    const tr = el("div", "track");
    for (const i of r.items){
      const it = reg(i, where ? where(ph, r) : r.name.replace(/ \(Bay [^)]*\)/, "")); if (!it) continue; ids.push(it.row_id); rowIds.push(it.row_id);
      const b0 = i.b ? i.b[0] : 1, b1 = i.b ? i.b[1] : maxB;
      const q = square(it, null, i.t || (i.b && b1 - b0 >= 1 ? (b0 + "–" + b1) : (i.b ? String(b0) : "")));
      q.style.left = `calc(${(b0 - 1) / maxB * 100}% + 1px)`; q.style.width = `calc(${(b1 - b0 + 1) / maxB * 100}% - 2px)`;
      tr.append(q);
    }
    const ex = el("div", "extra");
    for (const g of r.extra){ const it = reg(g, r.name.replace(/ \(Bay [^)]*\)/, "")); if (!it) continue; ids.push(it.row_id); ex.append(square(it, "inline", g.t)); }
    nm.addEventListener("click", () => rowBulk(nm.textContent, rowIds));
    const rowAreas = [...new Set(rowIds.map(r => ITEM.get(r).area))];
    ROWS.push({ ex, areas: rowAreas });
    row.append(nm, tr, ex); bd.append(row);
  }
  card._ids = ids; card._pct = pct;
  return card;
}
function levelsCard(zones){
  const card = el("div", "card");
  const h = el("h3"); h.append(document.createTextNode("Decking & ramps by level")); const pct = el("span", "pct"); h.append(pct); card.append(h);
  const sc = el("div", "scroll"); const mx = el("div", "mx"); sc.append(mx); card.append(sc);
  mx.style.gridTemplateColumns = `110px repeat(${zones.length}, minmax(64px,1fr))`;
  mx.append(el("span")); zones.forEach(z => mx.append(el("span", "h", z.zone)));
  const rows = [["L1","Decking L1"],["L2","Decking L2"],["L3","Decking L3"],["L4","Decking L4"],["L5","Decking L5"],["L6","Decking L6"],["L7","Decking L7"],["L8","Decking L8"],["L9","Decking L9"],"sep",["R1-3","Ramps L1–3"],["R4-6","Ramps L4–6"],["R7-9","Ramps L7–9"]];
  const ids = [];
  for (const r of rows){
    if (r === "sep"){ mx.append(el("div", "sep")); continue; }
    mx.append(el("span", "rl", r[1]));
    for (const z of zones){
      const raw = z.cells[r[0]];
      const it = raw && reg(raw, z.zone === "Induction" ? "Induction / Transition" : "Transfer Deck " + z.zone);
      if (!it){ const bl = el("div", "blank"); bl.title = "Not in this zone"; mx.append(bl); continue; }
      ids.push(it.row_id); const cell = el("div", "cell"); cell.append(square(it, null, raw.t ? raw.t + " ramps" : "")); mx.append(cell);
    }
  }
  card._ids = ids; card._pct = pct;
  const note = el("p", "note", "Dashed cells are levels a zone doesn't have."); note.style.marginTop = "8px"; card.append(note);
  return card;
}
function platformCard(pls){
  const parts = ["Columns","Beams","C Channels","Handrail","Decking","Stairs"];
  const card = el("div", "card");
  const h = el("h3"); h.append(document.createTextNode("Platforms")); const pct = el("span", "pct"); h.append(pct); card.append(h);
  const sc = el("div", "scroll"); const mx = el("div", "mx"); sc.append(mx); card.append(sc);
  mx.style.gridTemplateColumns = `170px repeat(${parts.length}, minmax(64px,1fr))`;
  mx.append(el("span")); parts.forEach(p => mx.append(el("span", "h", p)));
  const ids = [];
  for (const pl of pls){
    mx.append(el("span", "rl", pl.code + " " + pl.name));
    for (const p of parts){
      const raw = pl.cells[p]; const it = raw && reg(raw, pl.code + " " + pl.name);
      if (!it){ const bl = el("div", "blank"); bl.title = "Not part of this platform"; mx.append(bl); continue; }
      ids.push(it.row_id); const cell = el("div", "cell"); cell.append(square(it)); mx.append(cell);
    }
  }
  card._ids = ids; card._pct = pct;
  return card;
}
function otherCards(groups){
  const box = el("div", "tiles"); const cards = [];
  for (const g of groups){
    const card = el("div", "card"); const h = el("h3"); h.append(document.createTextNode(g.name)); const pct = el("span", "pct"); h.append(pct); card.append(h);
    const list = el("div", "tile-list"); const ids = [];
    for (const raw of g.items){ const it = reg(raw, g.name); if (!it) continue; ids.push(it.row_id); const tr = el("div", "trow"); tr.append(el("span", null, raw.n), square(it)); list.append(tr); }
    card.append(list); card._ids = ids; card._pct = pct; box.append(card); cards.push(card);
  }
  return [box, cards];
}
function area(title, nodes, cards){
  const d = el("details", "area"); d.open = true; const s = el("summary"); const p = el("span", "area-pct"); s.append(el("h2", null, title), p); d.append(s);
  const body = el("div", "area-body"); nodes.forEach(n => body.append(n)); d.append(body);
  const wrap = el("section", "zone"); wrap.append(d);
  AREAS.push({ pct: p, cards }); cards.forEach(c => CARDS.push(c));
  $("areas").append(wrap);
}
function buildBoard(){
  const B = S.layout; $("areas").textContent = ""; SQ.clear(); CARDS.length = 0; AREAS.length = 0; ROWS.length = 0; ITEMS_BY_KEY.clear(); MAPEL = null; MAPPED.clear();
  $("viewrow").hidden = !MAP_SITES[CFG.site];
  for (const b of document.querySelectorAll(".viewtog button")) b.setAttribute("aria-pressed", String(b.dataset.v === (mapOn() ? "map" : "list")));
  document.body.classList.toggle("mapview", mapOn());
  if (mapOn()){
    buildMap();
    const missing = [...ITEM.values()].filter(it => !it.key);
    if (missing.length){
      const groups = {}; for (const it of missing) (groups[it.area] ||= []).push({ k: "r" + it.row_id, n: it.label || ("Row " + it.row_id) });
      const [ob, oc] = otherCards(Object.entries(groups).map(([name, items]) => ({ name, items })));
      area("Not on the layout yet", [ob], oc);
    }
    return buildLegend(true);
  }
  const mb = list => Math.max(...list.flatMap(ph => ph.rows.flatMap(r => r.items.map(i => i.b ? i.b[1] : 0))));
  if (B.aisles?.length){ const ac = B.aisles.map(ph => aisleCard(ph, mb(B.aisles))); area("Product & bot aisles", ac, ac); }
  if (B.tote?.length){ const tc = B.tote.map(ph => aisleCard(ph, mb(B.tote))); area("Tote walls", tc, tc); }
  if (B.deck?.length){
    const dz = B.deck.map(z => aisleCard(z, mb(B.deck.filter(x => !x.max)), (ph) => ph.name.replace("Transfer Deck – ", "TD ")));
    const nodes = [...dz], cards = [...dz];
    if (B.levels?.length){ const lc = levelsCard(B.levels); nodes.push(lc); cards.push(lc); }
    area("MiniBot deck", nodes, cards);
  }
  if (B.other?.length){ const [ob, oc] = otherCards(B.other); area("Lift cells, S&C and core", [ob], oc); }
  if (B.platforms?.length){ const pc = platformCard(B.platforms); area("Platforms", [pc], [pc]); }
  // anything in the items table that the layout doesn't show yet
  const missing = [...ITEM.values()].filter(it => !it.key);
  if (missing.length){
    const groups = {}; for (const it of missing) (groups[it.area] ||= []).push({ k: "r" + it.row_id, n: it.label || ("Row " + it.row_id) });
    const [ob, oc] = otherCards(Object.entries(groups).map(([name, items]) => ({ name, items })));
    area("Not on the layout yet", [ob], oc);
  }
  buildLegend(false);
}
function buildLegend(isMap){
  const lg = $("legend"); lg.textContent = "";
  const mk = (label, style) => { const s = el("span"); const i = el("i"); if (style) i.style.cssText = style; s.append(i, document.createTextNode(label)); lg.append(s); };
  if (isMap) mk("Not started (print phase colour)", "background:" + M.tint.cyan); else mk("Not started"); mk("Fill = weighted install %", "background:linear-gradient(to top,var(--work) 45%,var(--empty) 45%)");
  mk("QC passed (green dot)", "border-color:var(--ok)"); mk("QC failed (red)", "border:2px solid var(--bad)");
  mk("Missing material (orange corner)", "background:linear-gradient(135deg,var(--warn) 30%,var(--empty) 30%)");
  mk("Planned this week", "box-shadow:inset 0 0 0 2px var(--plan0)"); mk("Next week", "box-shadow:inset 0 0 0 2px var(--plan1)");
  mk("Weeks 3–4 (Lookahead tab)", "box-shadow:inset 0 0 0 2px var(--plan2)"); mk("Planned earlier, not finished", "box-shadow:inset 0 0 0 2px var(--late)");
  mk("Doesn't apply", "background:repeating-linear-gradient(135deg,var(--empty) 0 3px,var(--hatch) 3px 6px)");
}

/* ---------- site map: squares placed like CWP diagram 250-04877 Rev C (+ S13.00) ---------- */
// Coordinates: x = points measured off the CWP print (west 1077 -> east 1802),
// v = bay units from the delta deck (0) toward the rear wall (~57). Squares come from the
// same layout rows as the list view, so RowIDs, painting, sheets and the lookahead are shared.
const MAP_SITES = { palestine: true };
const QT = new Set(["q25", "q50", "q75", "q100"]);   // quarter-step tasks (25/50/75/100%)
// stepped tasks: keys "<base>_<n>" (tdj_10 … tdj_100) = one task (tdj) marked in % steps; they share its weight
const stepBase = t => { const m = /^([a-z0-9]+)_(\d+)$/.exec(t); return m ? m[1] : null; };
const stepsOf = (it, base) => tasksFor(it).filter(t => stepBase(t) === base);
const appliesTo = (it, t) => tasksFor(it).includes(t) || stepsOf(it, t).length > 0;
const isGroup = t => Object.values(W).some(w => Object.keys(w).some(k => stepBase(k) === t && w[k] > 0));
let viewMode = store.get("view") || "map";
let mapZoom = store.get("mapzoom") || 0;              // 0 = automatic
const MAPPED = new Set();
let MAPEL = null;
const mapOn = () => viewMode === "map" && !!MAP_SITES[CFG.site] && !!S?.layout;
const M = {
  x0: 1077, x1: 1802, vTop: 57.8, vMin: -2, ky: 12.68,
  strips: [
    ["PRA010S", 1081, 1145, ["PA-054–055","A274","PA-052–053","A273","PA-050–051","A272"]],
    ["PRA009S", 1147, 1218, ["PA-048–049","A271","PA-046–047","A270","PA-044–045","A269"]],

function curZoom(){ return mapZoom || (window.matchMedia("(max-width:760px)").matches ? 2 : 1); }

function paint(rid){
  const it = ITEM.get(Number(rid)), b = SQ.get(Number(rid)); if (!it || !b) return;
  const tasks = tasksFor(it); const fill = b.firstChild; const q = qcOf(it.row_id);
  b.className = b.className.split(" ").filter(c => c === "sq" || c === "inline" || c === "sel" || c === "m").join(" ");
  if (pending.get(it.row_id)) b.classList.add("pending");
  if (FLAGS[it.row_id]) b.classList.add("mm");
  if (q && q.tags) b.classList.add("tagged");
  const pc = planClass(it.row_id);
  let title = `${it.where} – ${it.n}`;
  if (tab === "plan"){
    fill.style.height = (pctOf(it) * 100) + "%"; fill.style.setProperty("--c", "var(--hatch)");
    if (pc && (planWeek < 0 || pc === "plan" + planWeek || pc === "planlate")) b.classList.add(pc);
    const p = PLAN[it.row_id]; if (p) title += `\nPlanned week of ${p.week_start}${p.crew ? " · " + p.crew : ""}${p.tasks?.length ? " · " + p.tasks.map(t => TASK[t]?.name || t).join(", ") : ""}`;
  } else if (layer === "all"){
    const p = pctOf(it);
    fill.style.height = (p * 100) + "%"; fill.style.setProperty("--c", "var(--work)");
    if (p >= .5) b.classList.add("full");
    if (q && q.qc === "Pass") b.classList.add("qcpass"); else if (q && q.qc === "Fail") b.classList.add("qcfail");
    if (pc === "plan0" || pc === "plan1" || pc === "planlate") b.classList.add(pc);
    title += `\nInstall ${Math.round(p * 100)}%` + (q && q.qc ? ` · QC ${q.qc}` : "");
  } else if (layer === "qc"){
    const p = pctOf(it); let c = null;
    if (q && q.qc === "Pass") c = "var(--ok)"; else if (q && q.qc === "Fail") c = "var(--bad)"; else if (p >= .9999) c = "var(--warn)";
    fill.style.height = c ? "100%" : "0"; fill.style.setProperty("--c", c || "var(--empty)"); if (c) b.classList.add("full");
    title += "\n" + (q && q.qc ? "QC " + q.qc + (q.reason ? " – " + q.reason : "") : p >= .9999 ? "Waiting on QC" : "Install not complete");
  } else if (!appliesTo(it, layer)){

  } else if (stepsOf(it, layer).length){
    const st = stepsOf(it, layer), f = st.filter(t => done(it.row_id, t)).length / st.length;
    fill.style.height = (f * 100) + "%"; fill.style.setProperty("--c", color(layer)); if (f >= .5) b.classList.add("full");

  }

  if (q && q.tags) title += "\nTags: " + q.tags;

}
function paintAll(){ for (const rid of SQ.keys()) paint(rid); summary(); }

function groupPct(ids){
  let tot = 0, got = 0;
  for (const rid of ids){
    const it = ITEM.get(rid); const tasks = tasksFor(it);
    if (layer === "all" || tab === "plan"){ const w = TYPE_TOTAL[it.area_type] || 0; tot += (it.bays || 1); got += (it.bays || 1) * pctOf(it); }
    else if (layer === "qc"){ tot += 1; if (qcOf(rid)?.qc === "Pass") got += 1; }
    else if (tasks.includes(layer)){ tot += 1; if (done(rid, layer)) got += 1; }
  }
  return tot ? got / tot * 100 : null;
}
function fmtPct(p){ return p == null ? "—" : (p > 0 && p < 10 ? p.toFixed(1) : Math.round(p)) + "%"; }
function planSummary(){
  const box = $("summary"); box.textContent = "";
  const wk = el("div", "wk"); wk.style.gridColumn = "1/-1";
  const card = (label, c, ids, onClick) => {
    let bays = 0, got = 0; for (const r of ids){ const it = ITEM.get(Number(r)); bays += it.bays || 1; got += (it.bays || 1) * pctOf(it); }
    const b = el("button", "stat"); b.type = "button"; b.style.setProperty("--c", c);
    const lab = el("span", "lab"); lab.append(el("i"), document.createTextNode(label));
    const num = el("span", "num", String(ids.length)); num.append(el("small", null, `squares · ${Math.round(bays)} bays`));
    const bar = el("span", "bar"); const f = el("span"); f.style.width = (bays ? got / bays * 100 : 0) + "%"; bar.append(f);
    b.append(lab, num, bar, el("span", "lab", bays ? `${Math.round(got / bays * 100)}% installed so far` : "nothing planned"));
    if (onClick) b.addEventListener("click", onClick); wk.append(b);
  };
  const late = Object.keys(PLAN).filter(r => planClass(r) === "planlate");
  if (late.length) card("Carried over (earlier weeks, unfinished)", "var(--late)", late);
  for (let i = 0; i < PLAN_WEEKS; i++) card(weekLabel(i), `var(--plan${i})`, Object.keys(PLAN).filter(r => PLAN[r].week_start === weekStart(i)), () => { planWeek = i; buildLayers(); hint(); paintAll(); });
  box.append(wk);
  const pb = el("button", "btn", planWeek < 0 ? "Print lookahead (all weeks)" : "Print lookahead · " + weekLabel(planWeek)); pb.type = "button";
  pb.style.cssText = "grid-column:1/-1;justify-self:start";

// Grouped by phase, one line per aisle/area row: bays planned, install % so far, tasks still left.
function printLookahead(){
  const esc = x => String(x ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const order = [...SQ.keys()];                      // board order
  const weeks = [];
  if (planWeek < 0){
    const late = order.filter(r => planClass(r) === "planlate");
    if (late.length) weeks.push(["Carried over — planned in an earlier week, not finished", late, true]);
    for (let i = 0; i < PLAN_WEEKS; i++) weeks.push([weekLabel(i), order.filter(r => PLAN[r]?.week_start === weekStart(i))]);
  } else weeks.push([weekLabel(planWeek), order.filter(r => PLAN[r]?.week_start === weekStart(planWeek))]);
  if (!weeks.some(w => w[1].length)) return toast("Nothing is planned for " + (planWeek < 0 ? "the next 4 weeks" : weekLabel(planWeek)) + " yet.", null);
  const pctTxt = p => Math.round(p * 100) + "%";
  let body = "";
  for (const [label, ids, late] of weeks){
    if (!ids.length){ if (planWeek >= 0 || !late) body += `<h2>${esc(label)}</h2><p class="none">Nothing planned.</p>`; continue; }
    let bays = 0, got = 0; for (const r of ids){ const it = ITEM.get(r); bays += it.bays || 1; got += (it.bays || 1) * pctOf(it); }
    body += `<h2${late ? ' class="late"' : ""}>${esc(label)}<span>${ids.length} square${ids.length === 1 ? "" : "s"} · ${Math.round(bays)} bays · ${pctTxt(bays ? got / bays : 0)} installed so far</span></h2>`;
    // phase -> row name -> items
    const phases = new Map();
    for (const r of ids){ const it = ITEM.get(r); const ph = it.phase || it.area || ""; if (!phases.has(ph)) phases.set(ph, new Map()); const rows = phases.get(ph); if (!rows.has(it.where)) rows.set(it.where, []); rows.get(it.where).push(it); }
    for (const [ph, rows] of phases){
      body += `<h3>${esc(ph)}</h3><table><thead><tr><th class="ck"></th><th>Aisle / area</th><th>Bays</th><th class="n">#</th><th class="n">Installed</th><th>Still to do</th><th class="crew">Crew / notes</th></tr></thead><tbody>`;
      for (const [where, its] of rows){
        let b = 0, g = 0; const left = new Map(); let started = false;
        for (const it of its){
          b += it.bays || 1; g += (it.bays || 1) * pctOf(it);
          for (const t of tasksFor(it)){ if (done(it.row_id, t)) started = true; else left.set(t, (left.get(t) || 0) + 1); }
        }
        const pct = b ? g / b : 0;
        let todo;
        if (pct >= .9999) todo = '<span class="ok">Install complete</span>';
        else if (!started) todo = "Not started — all tasks";
        else todo = TASK_ORDER.filter(t => left.has(t)).map(t => esc(TASK[t].name) + (its.length > 1 && left.get(t) < its.length ? ` <small>(${left.get(t)} of ${its.length} left)</small>` : "")).join(", ");
        const flags = its.filter(it => FLAGS[it.row_id]).map(it => esc(it.n) + (FLAGS[it.row_id].note ? ": " + esc(FLAGS[it.row_id].note) : ""));
        if (flags.length) todo += `<div class="mm">Missing material — ${flags.join("; ")}</div>`;
        body += `<tr><td class="ck">☐</td><td><b>${esc(where)}</b></td><td>${its.map(it => esc(it.n)).join(", ")}</td><td class="n">${Math.round(b)}</td><td class="n">${pctTxt(pct)}</td><td>${todo}</td><td class="crew"></td></tr>`;
      }
      body += "</tbody></table>";
    }
  }
  const title = (S.site.name || "Site") + " — Lookahead";
  const html = `<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(title)}</title><style>
@page{size:letter landscape;margin:.45in}
body{font:12px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif;color:#1d232a;background:#fff;margin:16px}
.top{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #1d232a;padding-bottom:6px;margin-bottom:4px}
h1{font-size:18px;margin:0} .meta{color:#5b6670;font-size:11px;text-align:right}
h2{font-size:15px;margin:18px 0 4px;padding:4px 8px;background:#efe8fa;border-left:5px solid #7a4fd0;display:flex;justify-content:space-between;gap:12px;align-items:baseline;break-after:avoid}
h2.late{background:#fbe9e6;border-color:#c2412d} h2 span{font-size:11px;font-weight:500;color:#5b6670}
h3{font-size:12.5px;margin:10px 0 3px;break-after:avoid}

.n{text-align:right;white-space:nowrap;width:1%} .ck{width:14px;font-size:14px;color:#5b6670} .crew{width:20%}
td:nth-child(2){white-space:nowrap;width:1%} td:nth-child(3){width:22%}

.none{color:#5b6670;margin:2px 0 0 8px} .bar{margin:10px 0;display:flex;gap:8px} button{font:inherit;padding:6px 14px;border-radius:6px;border:1px solid #9aa4ad;background:#fff;cursor:pointer}

</style></head><body><div class="bar"><button onclick="print()">Print / Save as PDF</button><button onclick="close()">Close</button></div>
<div class="top"><h1>${esc(title)}</h1><div class="meta">Printed ${esc(new Date().toLocaleString([], { month: "short", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit" }))}${auth?.name ? " · " + esc(auth.name) : ""}<br>Install % as of print time</div></div>
${body}<script>addEventListener("load", () => setTimeout(print, 300));<\/script></body></html>`;
  const w = window.open("", "_blank");
  if (!w) return toast("Your browser blocked the print window — allow pop-ups for this site and try again.", null);
  w.document.open(); w.document.write(html); w.document.close();
}
function summary(){
  if (tab === "plan") return planSummary();
  const box = $("summary"); box.textContent = "";
  const all = [...SQ.keys()];
  const add = (key, name, c, p, sub) => {
    const b = el("button", "stat"); b.type = "button"; b.style.setProperty("--c", c);
    const lab = el("span", "lab"); lab.append(el("i"), document.createTextNode(name));
    const num = el("span", "num", fmtPct(p)); if (sub) num.append(el("small", null, sub));
    const bar = el("span", "bar"); const f = el("span"); f.style.width = (p || 0) + "%"; bar.append(f);
    b.append(lab, num, bar); b.addEventListener("click", () => { if (tab !== "progress") setTab("progress"); setLayer(key); }); box.append(b);
    if (key === "all" || key === "qc" || key === layer) b.classList.add("keep");
  };
  let bt = 0, bg = 0; for (const rid of all){ const it = ITEM.get(rid); bt += it.bays || 1; bg += (it.bays || 1) * pctOf(it); }
  add("all", "Install (weighted by bays)", "var(--work)", bt ? bg / bt * 100 : 0);
  let qt = 0, qp = 0, qw = 0; for (const rid of all){ qt++; const q = qcOf(rid); if (q?.qc === "Pass") qp++; else if (pctOf(ITEM.get(rid)) >= .9999) qw++; }
  add("qc", "QC passed", "var(--ok)", qt ? qp / qt * 100 : 0, `${qp}/${qt} · ${qw} waiting`);
  for (const t of TASK_ORDER){
    if (QT.has(t) || stepBase(t)) continue;
    let tot = 0, got = 0;
    for (const rid of all){ const it = ITEM.get(rid); if ((W[it.area_type] || {})[t] > 0){ tot++; if (done(rid, t)) got++; } else { const st = stepsOf(it, t); if (st.length){ tot++; got += st.filter(x => done(rid, x)).length / st.length; } } }
    if (!tot) continue;
    add(t, TASK[t].name, color(t), got / tot * 100, `${Math.round(got * 10) / 10}/${tot}`);
  }
  const more = el("button", "more", document.body.classList.contains("alltotals") ? "Hide task totals ▴" : "Show all task totals ▾"); more.type = "button";
  more.addEventListener("click", () => { document.body.classList.toggle("alltotals"); summary(); }); box.append(more);
  for (const c of CARDS) c._pct.textContent = fmtPct(groupPct(c._ids));
  for (const a of AREAS) a.pct.textContent = fmtPct(groupPct(a.cards.flatMap(c => c._ids))) + (layer === "all" ? " installed" : layer === "qc" ? " QC passed" : " " + (TASK[layer]?.name || "").toLowerCase());
}

function buildLayers(){
  const box = $("layers"); box.textContent = "";
  if (tab === "plan"){
    for (let i = -1; i < PLAN_WEEKS; i++){
      const c = el("button", "chip"); c.type = "button"; c.dataset.w = i; const d = el("span", "dot");
      d.style.background = i < 0 ? "linear-gradient(90deg,var(--plan0),var(--plan3))" : `var(--plan${i})`;
      c.append(d, document.createTextNode(i < 0 ? "All 4 weeks" : weekLabel(i))); c.setAttribute("aria-pressed", String(i === planWeek));
      c.addEventListener("click", () => { planWeek = i; buildLayers(); hint(); paintAll(); });
      box.append(c);
    }
    return;
  }
  const opts = [["all", "All (install %)"], ["qc", "QC"], ...TASK_ORDER.filter(t => !QT.has(t) && !stepBase(t) && (Object.values(W).some(w => w[t] > 0) || isGroup(t))).map(t => [t, TASK[t].name])];
  for (const [s, n] of opts){
    const c = el("button", "chip"); c.type = "button"; c.dataset.s = s;
    const d = el("span", "dot"); if (s === "qc") c.style.setProperty("--c", "var(--ok)"); else if (s !== "all") c.style.setProperty("--c", color(s));
    c.append(d, document.createTextNode(n)); c.setAttribute("aria-pressed", String(s === layer));
    c.addEventListener("click", () => setLayer(s));
    box.append(c);
  }
}
function hint(){
  const h = $("modehint");
  const ro = isCrew() ? "" : " <span>(view only — sign in to make changes)</span>";
  if (tab === "plan") h.innerHTML = planWeek < 0
    ? "<b>4-week lookahead:</b> outline colour shows the planned week; red outline = planned in an earlier week and still not finished. Pick a week to add or remove squares." + ro
    : `<b>Lookahead · ${weekLabel(planWeek)}:</b> tap squares (or a row name) to add or remove them from that week. Planning stays on the board; it doesn't go to Smartsheet.` + ro;
  else if (catchUp && layer === "all") h.innerHTML = "<b>Catch-up · All:</b> tap a square and tick what was already finished, or pick a task above and tap squares / row names to fill them in quickly.";
  else if (layer === "all") h.innerHTML = "<b>All:</b> fill shows weighted install %. Tap a square to check off tasks, flag missing material or report an issue." + ro;
  else if (layer === "qc") h.innerHTML = "<b>QC (from Smartsheet):</b> green passed, red failed, amber install complete and waiting on QC." ;
  else h.innerHTML = `<b>${TASK[layer].name}:</b> tap a square to mark it done, tap again to clear. Tap a row name to mark the whole row.` + ro;
}
function setLayer(s){ layer = s; buildLayers(); hint(); paintAll(); }

/* ---------- interaction ---------- */
function needSignIn(){ toast("Sign in with the site passcode to make changes.", null, "Sign in", openSignIn); }

function onSquare(it){
  if (tab === "plan"){ if (planWeek < 0) return openSheet(it); if (!isCrew()) return needSignIn(); return togglePlan([it.row_id]); }
  if (layer !== "all" && layer !== "qc"){
    if (stepsOf(it, layer).length) return openSheet(it);
    if (!tasksFor(it).includes(layer)) return;
    if (!isCrew()) return openSheet(it);
    const was = done(it.row_id, layer);
    mark([it.row_id], layer, !was);
    if (!was && !catchReady()) return;
    toast(`${was ? "Cleared" : catchUp ? "Caught up" : "Marked"} ${TASK[layer].name} · ${it.where} ${it.n}`, () => mark([it.row_id], layer, was));
    const b = SQ.get(it.row_id); b.classList.remove("flash"); void b.offsetWidth; b.classList.add("flash");
    return;
  }
  openSheet(it);
}
function rowBulk(name, ids){
  if (tab === "plan"){ if (planWeek < 0) return toast("Pick a week first, then tap the row name.", null); if (!isCrew()) return needSignIn(); return togglePlan(ids); }
  if (layer === "all" || layer === "qc") return;
  if (!isCrew()) return needSignIn();
  const app = ids.filter(r => tasksFor(ITEM.get(r)).includes(layer));
  if (!app.length) return;
  const allDone = app.every(r => done(r, layer));
  if (!allDone && !catchReady()) return;
  confirmBox(`${allDone ? "Clear" : catchUp ? "Catch up" : "Mark"} ${TASK[layer].name} for all ${app.length} squares in ${name}?` + (catchUp && !allDone ? ` (done on ${catchDate}, no manhours)` : ""), allDone ? "Clear all" : "Mark all", () => {
    const changed = app.filter(r => done(r, layer) === allDone);
    mark(changed, layer, !allDone);
    toast(`${allDone ? "Cleared" : "Marked"} ${changed.length} square${changed.length === 1 ? "" : "s"} · ${name}`, () => mark(changed, layer, allDone));
  });
}

function catchReady(){
  if (!catchUp) return true;
  if (!catchDate){ toast("Pick the date the work was done first.", null); $("catchdate").focus(); return false; }
  return true;
}
// Taps update the board instantly and go into a save queue; the queue sends them to the
// server one batch at a time in the background, so crews can keep checking boxes while
// earlier taps are still saving to Supabase/Smartsheet.
const saveQ = [];               // [{ids, task, on, backfill, done_date}]
let saving = false;
function mark(ids, task, on){
  if (!ids.length) return;
  if (on && !catchReady()) { if (selected && ids.includes(selected)) renderSheet(); return; }
  for (const r of ids){ const s = PROG[r] || (PROG[r] = new Set()); on ? s.add(task) : s.delete(task); pending.set(r, (pending.get(r) || 0) + 1); paint(r); }
  // a tap that reverses a queued, not-yet-sent tap cancels it instead of sending both
  const q = saveQ.length && saveQ[saveQ.length - 1];
  if (q && q.task === task && q.on !== on && q.ids.length === ids.length && q.ids.every((r, i) => r === ids[i])){
    saveQ.pop();
    for (const r of ids) settle(r, 2);
  } else {
    saveQ.push(catchUp && on ? { ids, task, on, backfill: true, done_date: catchDate } : { ids, task, on });
  }
  summary(); if (selected && ids.includes(selected)) renderSheet();
  saveStatus(); flushSaves();
}
function settle(r, n = 1){ const c = (pending.get(r) || n) - n; if (c > 0) pending.set(r, c); else pending.delete(r); paint(r); }
function saveStatus(){
  const n = saveQ.length + (saving ? 1 : 0);
  if (n) setStatus("Saving " + n + (n === 1 ? " change…" : " changes…"));
  else setStatus("Live · saved " + new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }));
}
async function flushSaves(){
  if (saving || !saveQ.length) return;
  saving = true;
  const op = saveQ.shift();
  let failed = null, syncErr = null, res = null;
  try {
    res = await api("mark", op.backfill ? { row_ids: op.ids, task: op.task, on: op.on, backfill: true, done_date: op.done_date } : { row_ids: op.ids, task: op.task, on: op.on });
    if (res.sync && res.sync.errors && res.sync.errors.length) syncErr = res.sync.errors[0];
  } catch(e){ failed = e; }
  for (const r of op.ids) settle(r);
  // only take the server's copy for rows with nothing else still waiting to save
  if (res) for (const [r, s] of Object.entries(res.progress || {})) if (!pending.get(Number(r))) PROG[r] = new Set(s ? s.split(" ") : []);
  saving = false;
  if (failed){
    // drop everything still queued and put the board back to what the server has
    for (const q of saveQ.splice(0)) for (const r of q.ids) settle(r);
    try { const d = await api("poll"); applyLive(d); } catch(e){}
    paintAll();
    toast("Not saved: " + failed.message + " — board reset to the last saved state.", null);
  } else if (syncErr) toast("Saved on the board, but Smartsheet didn't update: " + syncErr, null);
  const sel = selected && (failed || op.ids.includes(selected));
  summary(); if (sel && !pending.get(selected)) renderSheet();
  saveStatus();
  flushSaves();
}
window.addEventListener("beforeunload", e => { if (saving || saveQ.length){ e.preventDefault(); e.returnValue = ""; } });

async function togglePlan(ids){
  const ws = weekStart(planWeek);
  const allIn = ids.every(r => PLAN[r] && PLAN[r].week_start === ws);
  const before = ids.map(r => [r, PLAN[r]]);
  for (const r of ids){ if (allIn) delete PLAN[r]; else PLAN[r] = { row_id: r, week_start: ws, crew: null, tasks: [] }; paint(r); }
  try {
    const res = await api("plan_set", { row_ids: ids, week_start: allIn ? null : ws });
    PLAN = {}; for (const p of res.plan || []) PLAN[p.row_id] = p; paintAll();
  } catch(e){ for (const [r, p] of before){ if (p) PLAN[r] = p; else delete PLAN[r]; paint(r); } toast("Not saved: " + e.message, null); }
}

/* ---------- row sheet ---------- */
let detail = null;
function openSheet(it){
  if (selected) SQ.get(selected)?.classList.remove("sel");
  selected = it.row_id; SQ.get(it.row_id)?.classList.add("sel");
  $("sheet-title").textContent = it.where + " – " + it.n;
  $("sheet").hidden = false; detail = null; renderSheet();
  const rid = it.row_id;
  api("row_detail", { row_id: rid }).then(d => { if (selected === rid){ detail = d; renderSheet(); } }).catch(() => {});
}
function closeSheet(){ if (selected) SQ.get(selected)?.classList.remove("sel"); selected = null; $("sheet").hidden = true; }
function fmtWhen(s){ return s ? new Date(s).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) : ""; }
function tagUrl(it){
  const q = qcOf(it.row_id) || {};
  const base = S.site.tag_form_url; if (!base) return null;
  const p = new URLSearchParams(); p.set("Area of missing material", q.nn || it.phase || ""); p.set("Bay Reference", q.teka || (it.where + " - " + it.n)); p.set("Tracker RowID", String(it.row_id));
  return base + "?" + p.toString().replace(/\+/g, "%20");
}
function renderSheet(){
  if (!selected) return;
  const it = ITEM.get(selected); const box = $("sheet-body"); box.textContent = "";
  const q = qcOf(it.row_id) || {}; const p = pctOf(it);
  $("sheet-meta").textContent = `RowID ${it.row_id} · ${it.area} · ${it.bays || 0} bays` + (isCrew() ? "" : " · view only");
  const top = el("div", "box"); const pr = el("div", "row"); pr.append(el("b", null, "Install " + Math.round(p * 100) + "%"));
  if (p >= .9999) pr.append(el("span", "pill " + (q.qc === "Pass" ? "closed" : "open"), q.qc === "Pass" ? "QC passed" : q.qc === "Fail" ? "QC failed" : "Waiting on QC"));
  const bar = el("span", "bar"); const f = el("span"); f.style.width = p * 100 + "%"; bar.append(f); top.append(pr, bar); box.append(top);
  const byTask = {}; for (const r of detail?.progress || []) byTask[r.task_key] = r;
  const w = W[it.area_type] || {}; const tot = TYPE_TOTAL[it.area_type] || 1;
  const qtasks = tasksFor(it).filter(t => QT.has(t));
  if (qtasks.length){
    // quarter steps: one tap sets the amount in place; tapping the current amount steps back one
    const n = qtasks.filter(t => done(it.row_id, t)).length;
    const seg = el("div", "pctseg");
    qtasks.forEach((t, i) => {
      const b = el("button", (i < n ? "on" : "") + (i + 1 === n ? " cur" : ""), TASK[t].name); b.type = "button"; b.disabled = !isCrew();
      b.setAttribute("aria-pressed", String(i + 1 === n));
      b.addEventListener("click", () => {
        const target = i + 1 === n ? i : i + 1;
        if (target > n && !catchReady()) return;
        qtasks.forEach((q, j) => { const want = j < target; if (done(it.row_id, q) !== want) mark([it.row_id], q, want); });
      });
      seg.append(b);
    });
    box.append(seg);
    const last = qtasks.filter(t => done(it.row_id, t)).map(t => byTask[t]).filter(Boolean).sort((a, b) => String(b.done_at).localeCompare(String(a.done_at)))[0];
    box.append(el("div", "meta", n >= qtasks.length ? "100% in place — QC gets flagged in Smartsheet." : "Tap the amount that's in place. Tap the current one again to step back." + (last ? " Last change " + [fmtWhen(last.done_at), last.done_by].filter(Boolean).join(" · ") : "")));
  }
  const order = []; { const seen = new Set(); for (const t of tasksFor(it)){ const k = stepBase(t) || t; if (!seen.has(k)){ seen.add(k); order.push(k); } } }
  order.sort((a, b) => (TASK[a]?.sort ?? 999) - (TASK[b]?.sort ?? 999));
  for (const t of order){
    if (QT.has(t)) continue;
    const st = stepsOf(it, t);
    if (st.length){
      const n = st.filter(x => done(it.row_id, x)).length, ws = st.reduce((a, x) => a + (w[x] || 0), 0);
      const g = el("div", "stepgrp" + (n >= st.length ? " done" : "")); g.style.setProperty("--c", color(t));
      const hd = el("div", "stephd"); hd.append(el("span", null, TASK[t]?.name || t), el("b", null, Math.round(n / st.length * 100) + "%"), el("span", "w", Math.round(ws / tot * 100) + "%")); g.append(hd);
      const seg = el("div", "pctseg n" + st.length);
      st.forEach((x, i) => {
        const b = el("button", (i < n ? "on" : "") + (i + 1 === n ? " cur" : ""), String(Math.round((i + 1) / st.length * 100))); b.type = "button"; b.disabled = !isCrew();
        b.setAttribute("aria-label", `${TASK[t]?.name || t} ${b.textContent}%`); b.setAttribute("aria-pressed", String(i + 1 === n));
        b.addEventListener("click", () => {
          const target = i + 1 === n ? i : i + 1;
          if (target > n && !catchReady()) return;
          st.forEach((q, j) => { const want = j < target; if (done(it.row_id, q) !== want) mark([it.row_id], q, want); });
        });
        seg.append(b);
      });
      g.append(seg);
      g.append(el("span", "stepnote", Math.round(100 / st.length) + "% per level"));
      const last = st.filter(x => done(it.row_id, x)).map(x => byTask[x]).filter(Boolean).sort((a, b) => String(b.done_at).localeCompare(String(a.done_at)))[0];
      if (last) g.append(el("span", "who", [fmtWhen(last.done_at), last.done_by].filter(Boolean).join(" · ")));
      box.append(g); continue;
    }
    const d = done(it.row_id, t);
    const lab = el("label", "stg" + (d ? " done" : "")); lab.style.setProperty("--c", color(t));
    const cb = el("input"); cb.type = "checkbox"; cb.checked = d; cb.disabled = !isCrew();

  const keys = Object.keys(peak).filter(k => peak[k] > 0);
  return keys.map(k => ({ area_key: k, people: peak[k], hours: C.day.shift_hours, group_areas: k.startsWith("grp:") ? (grp[k] || (C.day.groups.find(g => "grp:" + g.name === k) || {}).areas || null) : null }));

let R = { from: null, to: null, data: null };
function renderReport(){
  const v = $("view-report"); v.textContent = "";
  v.append(el("h2", null, "Hours report"));
  if (!isCrew()){ v.append(el("p", "note", "Sign in to see crew hours.")); return; }
  const today = S.site.today; if (!R.to) R.to = today; if (!R.from){ const d = new Date(today + "T12:00:00"); d.setDate(d.getDate() - 30); R.from = ymd(d); }
  const r = el("div", "row"); const f = el("input"); f.type = "date"; f.value = R.from; const t = el("input"); t.type = "date"; t.value = R.to;
  const go = el("button", "btn primary", "Show"); const csv = el("button", "btn", "Download CSV"); csv.disabled = !R.data;
  r.append(el("span", null, "From"), f, el("span", null, "to"), t, go, csv); v.append(r);
  const out = el("div"); out.style.cssText = "display:grid;gap:14px"; v.append(out);
  go.addEventListener("click", async () => { R.from = f.value; R.to = t.value; out.textContent = "Loading…"; try { R.data = await api("report", { from: R.from, to: R.to }); renderReport(); } catch(e){ out.textContent = e.message; } });
  csv.addEventListener("click", () => downloadCsv());
  if (!R.data){ out.append(el("p", "note", "Pick a date range and press Show. Only closed days are counted.")); return; }
  const rows = reportRows();
  // earned bays belong to the area and day, not the crew — count each area-day once
  const by = (keyFn) => { const m = {}; for (const x of rows){ const k = keyFn(x); const a = m[k] ||= { hours: 0, earned: 0, inst: 0, seen: new Set() }; a.hours += x.hours; if (x.phase) a.inst += x.hours; const ad = x.date + "|" + x.area; if (!a.seen.has(ad)){ a.seen.add(ad); a.earned += x.earned; } } return m; };
  const allSeen = new Set(); let allE = 0, allH = 0, allI = 0; for (const x of rows){ allH += x.hours; if (x.phase) allI += x.hours; const ad = x.date + "|" + x.area; if (!allSeen.has(ad)){ allSeen.add(ad); allE += x.earned; } }
  const table = (title, m, first) => {
    const c = el("div", "card"); c.append(el("h3", null, title)); const sc = el("div", "scroll"); const tt = el("table", "t");
    tt.innerHTML = `<thead><tr><th>${first}</th><th>Hours</th><th>Earned bays</th><th>Hours per bay</th></tr></thead>`;
    const tb = el("tbody"); const H = allH, E = allE, I = allI;
    for (const [k, a] of Object.entries(m).sort((x, y) => y[1].hours - x[1].hours)){ const tr = el("tr"); tr.append(el("td", null, k), el("td", "num", a.hours.toFixed(1)), el("td", "num", a.earned.toFixed(1)), el("td", "num", a.earned > 0 ? (a.hours / a.earned).toFixed(2) : "—")); tb.append(tr); }
    tt.append(tb); const tf = el("tfoot"); const fr = el("tr"); fr.append(el("td", null, "Total"), el("td", "num", H.toFixed(1)), el("td", "num", E.toFixed(1)), el("td", "num", E > 0 ? (I / E).toFixed(2) : "—")); tf.append(fr); tt.append(tf);
    sc.append(tt); c.append(sc); return c;
  };
  out.append(el("p", "note", `${R.data.days.filter(d => d.status === "closed").length} closed crew-days. Hours per bay counts only install areas (non-install time is listed separately). Earned bays = bays × share of weighted tasks checked off that day; when racking and electrical both work an area the same day, each discipline line shows the bays it worked alongside, and totals count them once.`));
  out.append(table("By phase & discipline", by(x => (x.phase || "Non-install") + " · " + x.discipline), "Phase · discipline"));
  out.append(table("By area", by(x => x.area), "Area"));
}
function reportRows(){
  const crew = Object.fromEntries(R.data.crews.map(c => [c.id, c]));
  return R.data.hours.map(h => ({ date: h.work_date, crew: crew[h.crew_id]?.name || "", discipline: crew[h.crew_id]?.discipline || "", area: h.area, phase: R.data.areas[h.area]?.phase || "", hours: Number(h.hours), earned: Number(h.earned_bays || 0) }));
}
function downloadCsv(){
  const rows = reportRows(); const q = s => '"' + String(s).replace(/"/g, '""') + '"';
  const lines = ["Date,Crew,Discipline,Phase,Area,Hours,Earned bays", ...rows.map(r => [r.date, q(r.crew), q(r.discipline), q(r.phase), q(r.area), r.hours, r.earned].join(","))];
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([lines.join("\n")], { type: "text/csv" })); a.download = `hours_${R.from}_${R.to}.csv`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

  S = d; applyStatic(d); applyLive(d);
  if (auth && d.role && d.role !== auth.role){ auth.role = d.role; store.set("auth", auth); }
  if (auth && !d.role){ auth = null; store.del("auth"); }
  document.title = d.site.name + " · Progress Board"; $("title").textContent = d.site.name + " Progress Board";
  buildBoard(); renderWho();
}
async function poll(){
  if (document.hidden || !S || (tab !== "progress" && tab !== "plan")) return;
  if (pending.size) return;
  if (dockActive() && C.crewId && !Object.keys(C.draft).length && $("modal").hidden && !CB().contains(document.activeElement)){
    api("crew_day", { crew_id: C.crewId, date: C.date }).then(x => { if (!Object.keys(C.draft).length){ C.day = x; drawCrew(); paintBadges(); } }).catch(() => {});
  }
  try { const d = await api("poll"); if (pending.size) return; applyLive(d); paintAll(); if (selected) renderSheet(); setStatus("Live · updated " + new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })); }
  catch(e){ setStatus("Offline · " + e.message, true); }
}
function fixHeader(){ document.documentElement.style.setProperty("--hdr", document.querySelector("header.top").offsetHeight + "px"); }
window.addEventListener("resize", fixHeader);
document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });
(async function start(){
  fixHeader(); renderWho();
  try {
    await reload();
    setStatus("Live · updated " + new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }));
    const t = store.get("tab"); setTab(["progress", "plan", "crew", "report"].includes(t) || (t === "settings" && isAdmin()) ? t : "progress");
    fixHeader();
    setInterval(poll, (CFG.pollSeconds || 30) * 1000);
  } catch(e){ setStatus("Couldn't load: " + e.message, true); $("areas").textContent = ""; $("areas").append(el("p", "status err", "Couldn't reach the board server. " + e.message)); }
})();
</script>
